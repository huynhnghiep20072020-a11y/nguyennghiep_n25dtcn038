<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MiniShop</title>
</head>
<body>
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> | 
            <a href="about.html">Giới thiệu</a> |
            <a href="cart.html">Giỏ hàng</a> | 
            <a href="contact.html">Liên hệ</a> | 
            <a href="login.html">Đăng nhập</a> | 
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>
    <main>
        <h2>Đăng nhập</h2>
        <form action="login.html" method="post" class="form">
            <p>
                <label for="login-email">Email</label><br>
                <input type="email" id="login-email" name="email" required>
            </p>
            <p>
                <label for="login-password">Mật khẩu</label><br>
                <input type="password" id="login-password" name="password" required>
            </p>
            <p>
                <input type="checkbox" id="remember" name="remember" value="1">
                <label for="remember">Ghi nhớ đăng nhập</label>
            </p>
            <p>
                <button type="submit">Đăng nhập</button>
            </p>
            <p>
                <a href="register.html">Chưa có tài khoản? Đăng ký</a>
            </p>
        </form>
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>
</html>
